services:
  - type: web
    name: network-growth-agent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    numInstances: 1
    envVars:
      - key: APPLICATION_ENVIRONMENT
        value: demo
      - key: DATABASE_PATH
        value: /tmp/network-agent/network_agent.db
      - key: MEDIA_STORAGE_PATH
        value: /tmp/network-agent/media
      - key: BACKUP_PATH
        value: /tmp/network-agent/backups
      - key: LOG_PATH
        value: /tmp/network-agent/logs
      - key: RUNTIME_STATE_PATH
        value: /tmp/network-agent/runtime
      - key: LINKEDIN_TOKEN_PATH
        value: /tmp/network-agent/secrets/linkedin-tokens.enc
      - key: DEPLOYMENT_PERSISTENCE_ACKNOWLEDGED
        value: "false"
      - key: NETWORK_AGENT_DOTENV_OVERRIDE
        value: "false"
      - key: MOCK_MODE
        value: "true"
      - key: IMAGE_MODE
        value: disabled
      - key: DAILY_BRIEFING_ENABLED
        value: "false"
      - key: PUBLIC_SIGNAL_ALLOW_HTTP
        value: "false"
      - key: LINKEDIN_PUBLISH_MODE
        value: disabled
      - key: LINKEDIN_REAL_PUBLISH_ENABLED
        value: "false"
      - key: WEB_API_TOKEN
        generateValue: true
